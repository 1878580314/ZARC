name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zarc-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zarc-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zarc-desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tauri build --no-bundle：跑 beforeBuildCommand（svelte-check + vite build）
      # 后以生产模式编译，产出单文件 ZARC.exe。
      - name: Build ZARC.exe
        run: npm run tauri:build:win

      - name: Package release artifacts
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/ZARC.exe"
          if (-not (Test-Path $exe)) { throw "missing build output: $exe" }
          New-Item -ItemType Directory -Force "release" | Out-Null
          Copy-Item $exe "release/ZARC.exe"
          $hash = (Get-FileHash "release/ZARC.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  ZARC.exe" | Out-File -Encoding ascii "release/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ZARC ${{ github.ref_name }}
          generate_release_notes: true
          # defaults.working-directory 不影响 uses: 步骤，files 相对仓库根解析。
          files: zarc-desktop/release/*
